version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: student_radar_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-student_radar_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar_admin} -d ${POSTGRES_DB:-student_radar_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: student_radar_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_radar_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-radar_admin}:${POSTGRES_PASSWORD:-radar_secret_pass}@postgres:5432/${POSTGRES_DB:-student_radar_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-radar_admin}:${POSTGRES_PASSWORD:-radar_secret_pass}@postgres:5432/${POSTGRES_DB:-student_radar_db}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_for_development_purposes_only}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_radar_celery_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-radar_admin}:${POSTGRES_PASSWORD:-radar_secret_pass}@postgres:5432/${POSTGRES_DB:-student_radar_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-radar_admin}:${POSTGRES_PASSWORD:-radar_secret_pass}@postgres:5432/${POSTGRES_DB:-student_radar_db}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./backend:/app

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_radar_celery_beat
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_radar_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:

