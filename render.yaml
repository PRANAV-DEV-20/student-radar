version: "1"

databases:
  - name: student-radar-db
    plan: starter
    postgresMajorVersion: "16"

  - name: student-radar-redis
    plan: starter

services:
  - type: web
    name: student-radar-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: student-radar-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: student-radar-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://student-radar.vercel.app
      - key: ENABLE_CELERY_DISPATCH
        value: "false"
      - key: ENABLE_EXTERNAL_INTELLIGENCE
        value: "true"
      - key: ENABLE_GEMINI_EVENT_GROUNDING
        value: "true"
      - key: ENABLE_GITHUB_METRICS
        value: "true"
